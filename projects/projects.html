<!doctype html>
<html lang="tr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vatoz | tüm projeler</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico?v=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: { chillDark: "#1c1c1c", chillLight: "#e5e5e5" },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body
    class="bg-[#e5e5e5] text-[#1c1c1c] dark:bg-[#1c1c1c] dark:text-[#e5e5e5] transition-colors duration-300 font-sans antialiased min-h-screen flex flex-col justify-between"
  >
    <nav
      class="sticky top-0 z-50 backdrop-blur-md bg-[#e5e5e5]/75 dark:bg-[#1c1c1c]/75 border-b border-neutral-300 dark:border-neutral-800"
    >
      <div
        class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between"
      >
        <a
          href="../index.html"
          class="text-sm font-medium hover:opacity-60 transition"
          >&larr; ana sayfa</a
        >
      </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 py-16 flex-grow w-full space-y-12">
      <header class="space-y-2">
        <h1 class="text-2xl font-bold tracking-tight">
          tüm projeler & deneyler
        </h1>
        <p class="text-sm text-neutral-500 font-light">
          Dosyalardan otomatik okunan ve kronolojik olarak sıralanan projeler.
        </p>
        <div class="h-px bg-neutral-300 dark:bg-neutral-800 w-full pt-4"></div>
      </header>

      <div id="projects-container" class="space-y-8">
        <div id="loading-text" class="text-sm text-neutral-400 font-mono">
          Projeler taranıyor...
        </div>
      </div>
    </main>

    <footer
      class="max-w-2xl mx-auto px-4 py-8 text-center text-xs font-mono text-neutral-500 border-t border-neutral-300 dark:border-neutral-800 w-full"
    >
      &copy; 2026 vatoz. Tüm hakları saklıdır.
    </footer>

    <script src="../script.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        // Sadece okumak istediğin proje dosyalarının isimlerini buraya ekle bro, gerisine dokunma:
        const projeDosyalari = [
          "calculator.html",
          "tictactoe.html",
          "password-gen.html",
          "customer-segmentation.html",
          "kfold-validation.html",
          "nash-equilibrium.html",
        ];

        const container = document.getElementById("projects-container");
        const loadingText = document.getElementById("loading-text");
        let validProjects = [];

        // Tüm dosyaları arka planda oku
        for (const dosya of projeDosyalari) {
          try {
            const response = await fetch(dosya);
            if (!response.ok) continue;

            const text = await response.text();

            // Sanal bir parser ile dosya içeriğindeki meta etiketlerini ayıkla
            const parser = new DOMParser();
            const doc = parser.parseFromString(text, "text/html");

            const title =
              doc
                .querySelector('meta[name="project-title"]')
                ?.getAttribute("content") || dosya;
            const date =
              doc
                .querySelector('meta[name="project-date"]')
                ?.getAttribute("content") || "0000-00";
            const dateText =
              doc
                .querySelector('meta[name="project-date-text"]')
                ?.getAttribute("content") || "BİLİNMİYOR";
            const desc =
              doc
                .querySelector('meta[name="project-desc"]')
                ?.getAttribute("content") || "Açıklama girilmemiş.";

            validProjects.push({ dosya, title, date, dateText, desc });
          } catch (e) {
            console.error(`${dosya} okunurken hata oluştu:`, e);
          }
        }

        // Tarihe göre büyükten küçüğe sırala (En yeni en üstte)
        validProjects.sort((a, b) => b.date.localeCompare(a.date));

        // Yükleniyor yazısını kaldır
        loadingText.remove();

        // Sıralanan projeleri HTML olarak bas
        validProjects.forEach((proj) => {
          const html = `
            <a href="${proj.dosya}" class="group flex items-baseline justify-between gap-4 border-b border-neutral-200 dark:border-neutral-900 pb-4 hover:opacity-70 transition-all">
              <div class="space-y-1">
                <h4 class="text-base font-medium tracking-tight group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">
                  ${proj.title}
                </h4>
                <p class="text-sm text-neutral-500 font-light line-clamp-1">
                  ${proj.desc}
                </p>
              </div>
              <div class="text-xs font-mono text-neutral-400 shrink-0">${proj.dateText}</div>
            </a>
          `;
          container.insertAdjacentHTML("beforeend", html);
        });
      });
    </script>
  </body>
</html>
